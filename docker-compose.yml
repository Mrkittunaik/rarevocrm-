services:
  crm:
    build: .
    container_name: rarevo-crm
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    # lets the CRM reach the Rarevo WhatsApp platform running on the same machine:
    # use http://host.docker.internal/api/crm/v1 as the API URL instead of http://localhost/...
    extra_hosts:
      - "host.docker.internal:host-gateway"
